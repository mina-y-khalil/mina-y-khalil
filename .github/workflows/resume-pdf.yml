# Every push to main re-renders the resume PDF from the site, so the PDF button's fallback (phones and
# in-app browsers that can't print) always serves the current version.
name: Resume PDF

on:
  push:
    branches: [main]
    paths-ignore: ['assets/Mina-Khalil-Resume.pdf']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: resume-pdf
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.50.1
          npx playwright install --with-deps chromium

      - name: Render the PDF
        run: node .github/scripts/resume-pdf.mjs

      - name: Commit it if it changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/Mina-Khalil-Resume.pdf
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Resume PDF regenerated from the site [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # a push made with the workflow token doesn't always start a Pages build on its own
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        run: >
          curl -fsS -X POST
          -H "Authorization: Bearer ${{ github.token }}"
          -H "Accept: application/vnd.github+json"
          "https://api.github.com/repos/${{ github.repository }}/pages/builds"
          || echo "Pages build request skipped (the site deploys on the next push)"
